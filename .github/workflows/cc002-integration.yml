name: CC-002 Windows Qt WebEngine integration

on:
  pull_request:
    paths:
      - "spike/**"
      - "tests/**"
      - "frontend/**"
      - ".github/workflows/cc002-integration.yml"
      - "python-constraints.txt"
      - "requirements.txt"
  push:
    branches:
      - feature/CC-002-webengine-webchannel-spike

concurrency:
  group: cc002-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cc002-windows-integration:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python 3.12.10 x64
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.10"
          architecture: x64
      - name: Node 24.22.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.22.0"
      - name: Verify exact toolchains and install locked Python
        shell: pwsh
        run: |
          python -c "import sys,struct; assert sys.version_info[:3]==(3,12,10) and struct.calcsize('P')*8==64"
          if ((node --version) -ne "v24.22.0") { throw "Node version changed" }
          if ((npm --version) -ne "11.19.1") { throw "npm version changed" }
          python -m pip install --only-binary=:all: -r requirements.txt -c python-constraints.txt
          python -m pip check
      - name: Build Vite static frontend from existing npm lock
        shell: pwsh
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
          if (!(Test-Path dist/index.html)) { throw "No static Vite output" }
      - name: Python IPC/security unit tests (real Qt imports)
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_protocol.py" -v
          python -m unittest discover -s tests -p "test_security.py" -v
      - name: Real Qt WebEngine + JavaScript/QWebChannel integration
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: |
          python scripts/cc002_ci_integration.py
      - name: Governance check
        shell: pwsh
        run: node scripts/verify_governance.mjs
