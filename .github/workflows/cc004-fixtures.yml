name: CC-004 Windows deterministic fixtures

on:
  push:
    branches:
      - feature/CC-004-fixture-benchmark-baseline
  pull_request:
    paths:
      - "benchmarks/**"
      - "tests/test_fixture_generator.py"
      - "scripts/cc004-*.ps1"
      - ".github/workflows/cc004-fixtures.yml"
      - "PROGRESS.md"
      - "README.md"
      - "docs/CC004_FIXTURES_BENCHMARK.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cc004-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cc004-windows-fixtures:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install exact Python x64
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.10"
          architecture: x64
      - name: Python unit and destructive negative tests
        shell: pwsh
        run: |
          python -c "import sys,struct; assert sys.version_info[:3] == (3,12,10); assert struct.calcsize('P') == 8"
          python -m unittest discover -s tests -p test_fixture_generator.py -v
          if ($LASTEXITCODE -ne 0) { throw "CC004 tests failed" }
      - name: Generate 500 1000 5000 10000 and verify source counts
        shell: pwsh
        timeout-minutes: 26
        run: |
          $out=Join-Path $env:RUNNER_TEMP 'cc004-results'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          foreach($count in @(500,1000,5000,10000)){
            $root=Join-Path $env:RUNNER_TEMP "CC004 fixture $count"
            & python .\benchmarks\generate_fixture.py --output $root --count $count --profile mixed --seed 42 | Tee-Object -FilePath (Join-Path $out "generate-$count.jsonl")
            if($LASTEXITCODE -ne 0){throw "Generation failed: $count"}
            & python .\benchmarks\verify_fixture.py --root $root | Tee-Object -FilePath (Join-Path $out "verify-$count.jsonl")
            if($LASTEXITCODE -ne 0){throw "Verification failed: $count"}
            Copy-Item -LiteralPath "$root.manifest.json" -Destination (Join-Path $out "fixture-$count.manifest.json")
          }
          & .\benchmarks\capture_environment.ps1 -FixtureRoot $env:RUNNER_TEMP -OutputDir $out
      - name: Governance consistency
        shell: pwsh
        run: |
          node scripts/verify_governance.mjs
          if($LASTEXITCODE -ne 0){throw 'Governance failed'}
      - name: Upload evidence without source fixtures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CC004-Windows-evidence
          path: ${{ runner.temp }}/cc004-results/**
          if-no-files-found: warn
          retention-days: 14
